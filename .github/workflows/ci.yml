name: device protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: systemd-analyze verify clients/linux/ai-maestro-device.service
      - run: npm test
      - run: bash tests/smoke.sh
      - run: node tests/browser-smoke.mjs
        if: matrix.node == 24
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: agent-display-preview
          path: /tmp/adp-display.png
          retention-days: 2
      - name: Verify protected Linux signer
        if: matrix.node == 24
        run: sudo env PATH="$PATH" bash tests/broker-linux.sh
