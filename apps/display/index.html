<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent home · AI Maestro</title>
    <link rel="stylesheet" href="/screen.css" />
    <script defer src="/screen.js"></script>
  </head>
  <body data-state="disconnected">
    <header>
      <div class="brand"><b aria-hidden="true">≋</b> AI Maestro</div>
      <span>Agent home</span>
    </header>
    <section
      id="proposal"
      hidden
      role="region"
      aria-label="Device change awaiting approval"
    >
      <p id="proposal-text"></p>
      <button id="approve-change">Approve on this device</button
      ><button id="reject-change">Reject</button>
      <p id="proposal-error"></p>
    </section>
    <div id="capture-indicator" role="status" hidden></div>
    <main>
      <section class="presence" aria-label="Agent activity">
        <div class="signal" aria-hidden="true">
          <div class="orbit"></div>
          <div class="orb">
            <div class="wave">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <h1 id="name">Agent home</h1>
        <div class="status" role="status">
          <i></i><span id="status">Connecting</span>
        </div>
        <p id="address"></p>
        <p id="device-mode"></p>
        <section id="agent-output" hidden aria-label="Agent message">
          <p id="output-text"></p>
          <img
            id="output-image"
            alt="Image shown by the assigned agent"
            hidden
          />
        </section>
        <button id="use-device" hidden>Use this device</button>
        <form id="device-input" hidden>
          <label for="input-text">Talk to your agent</label>
          <textarea
            id="input-text"
            rows="2"
            maxlength="4096"
            required
          ></textarea>
          <button type="submit">Send</button>
          <p id="input-status" role="status"></p>
        </form>
      </section>
    </main>
    <aside id="pip" aria-label="Camera picture in picture">
      <div class="pip-head">
        <h2>Agent view</h2>
        <button id="expand" aria-expanded="false" aria-controls="preview">
          Expand
        </button>
      </div>
      <div id="preview">
        <img
          id="frame"
          alt="Most recent camera snapshot captured for the assigned agent"
          hidden
        /><span id="empty">Waiting for camera status</span>
      </div>
      <footer id="caption">Last camera snapshot</footer>
      <div id="consent" hidden>
        <label
          ><input type="checkbox" data-media="video" /> Allow live camera</label
        >
        <label
          ><input type="checkbox" data-media="microphone" /> Allow
          microphone</label
        >
        <label
          ><input type="checkbox" data-media="speaker" /> Allow speaker</label
        >
        <label
          ><input type="checkbox" data-output="display.text" /> Allow agent
          text</label
        >
        <label
          ><input type="checkbox" data-output="display.image" /> Allow agent
          images</label
        >
        <label
          ><input type="checkbox" data-output="speaker.say" /> Allow spoken
          replies</label
        >
        <label
          ><input type="checkbox" data-output="speaker.play" /> Allow agent
          audio</label
        >
        <button id="stop-media">Stop &amp; revoke media</button>
        <span id="media-status" role="status"></span>
      </div>
    </aside>
  </body>
</html>
