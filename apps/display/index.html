<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent home · AI Maestro</title>
<link rel="stylesheet" href="/screen.css">
<script defer src="/screen.js"></script>
</head>
<body data-state="idle" class="read-only no-talk no-input">
<canvas id="scope" aria-hidden="true"></canvas>

<div class="seg" id="seg-agent"></div>
<div class="seg" id="seg-you"><div class="eye">
  <img id="preview" class="view" alt="Camera preview" hidden>
  <div class="scrim"></div>
  <p id="eye-note">Only on this screen</p>
</div></div>

<div class="who"><h1 id="name">Agent home</h1><p id="status" role="status">Connecting</p></div>
<img id="output-image" alt="Image shown by the assigned agent" hidden>

<div class="you-name">You</div>
<div class="words" id="you-words"></div>
<div class="dock">
  <button id="talk" class="round"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></button>
</div>
<div class="tools">
  <button id="type" class="round tool" title="Type"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10.5 10h.01M14.5 10h.01M17.5 10h.01M8 14h8"/></svg></button>
  <button id="cc" class="round tool" aria-label="Captions" aria-expanded="false" aria-controls="captions" title="Captions">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17.5 10.2a2.2 2.2 0 1 0 0 3.6"/></svg>
  </button>
  <button id="cam" class="round tool" aria-label="Turn the camera off" aria-pressed="false" title="Camera">
    <svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 11l6-3.5v9l-6-3.5"/></svg>
    <svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 11l6-3.5v9l-6-3.5M3 3l18 18"/></svg>
  </button>
  <button id="gear" class="round tool" aria-label="Settings" aria-expanded="false">⚙</button>
</div>
<div id="captions" role="group" aria-label="Captions" hidden>
  <div class="row"><span id="caption-agent">Agent</span><button class="sw" role="switch" data-caption="agent" aria-checked="true" aria-labelledby="caption-agent"></button></div>
  <div class="row"><span id="caption-you">You</span><button class="sw" role="switch" data-caption="you" aria-checked="true" aria-labelledby="caption-you"></button></div>
</div>
<form class="typing" id="typing">
  <textarea id="text" maxlength="4096"></textarea>
  <button type="submit" class="round send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</form>

<aside aria-label="Settings" inert>
  <button id="close">Close</button>
  <h2 id="settings-title">What your agent can use</h2>
  <div class="row"><span>Camera</span><button class="sw" role="switch" data-group="camera" aria-checked="false" aria-label="Camera"></button></div>
  <div class="row"><span>Microphone</span><button class="sw" role="switch" data-group="microphone" aria-checked="false" aria-label="Microphone"></button></div>
  <div class="row"><span>Speaker<small>Voice and sounds</small></span><button class="sw" role="switch" data-group="speaker" aria-checked="false" aria-label="Speaker"></button></div>
  <div class="row"><span>Screen<small>Text and pictures</small></span><button class="sw" role="switch" data-group="screen" aria-checked="false" aria-label="Screen"></button></div>
  <p id="settings-error" role="status"></p>
  <button id="stop">Stop everything now</button>
</aside>

<section id="proposal" hidden role="region" aria-label="Device change awaiting approval">
  <p id="proposal-text"></p>
  <button id="approve-change">Approve on this device</button><button id="reject-change">Reject</button>
  <p id="proposal-error"></p>
</section>
<div id="capture-indicator" role="status" hidden></div>
</body>
</html>
